<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutas Operación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    body { background-color: #eaedf1; padding: 18px; color: #1e293b; }

    .window {
      background: #ffffff;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 1400px;
      margin: 0 auto;
      overflow: hidden;
    }

    .window-title {
      background: #f1f5f9;
      border-bottom: 1px solid #cbd5e1;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-sync {
      padding: 5px 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-sync:hover { background: #0369a1; }

    /* Barra superior idéntica a la imagen */
    .top-panel {
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .selector-label {
      font-weight: 700;
      font-size: 0.9rem;
      color: #334155;
    }

    .input-code {
      padding: 7px 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 1px solid #64748b;
      border-radius: 3px;
      width: 160px;
      text-transform: uppercase;
    }

    select.item-list {
      padding: 7px 10px;
      border: 1px solid #64748b;
      border-radius: 3px;
      font-size: 0.9rem;
      max-width: 220px;
    }

    /* Nombre del artículo grande y destacado (Columna S) */
    .item-name-banner {
      flex-grow: 1;
      min-width: 280px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #0284c7;
      padding: 8px 14px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      border-radius: 3px;
    }

    /* Tabla de operaciones compacta */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      max-height: 600px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 700;
      padding: 8px 10px;
      border-right: 1px solid #cbd5e1;
      border-bottom: 2px solid #94a3b8;
      text-align: center;
    }

    tbody td {
      padding: 6px 10px;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      color: #334155;
    }

    tbody tr:nth-child(even) { background-color: #f8fafc; }
    tbody tr:hover { background-color: #e0f2fe; }

    .center { text-align: center; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge-ct {
      display: inline-block;
      padding: 2px 7px;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 700;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="window">
    <div class="window-title">
      <span>Rutas Operación</span>
      <button class="btn-sync" onclick="cargarDatos()">🔄 Recargar Hoja</button>
    </div>

    <!-- Barra de búsqueda y visualización de Articulo -->
    <div class="top-panel">
      <span class="selector-label">Artículo:</span>
      <input type="text" id="inputArticulo" class="input-code" placeholder="Código..." list="listaCodigos" oninput="cambiarArticulo(this.value)">
      <datalist id="listaCodigos"></datalist>

      <span class="selector-label">Seleccionar:</span>
      <select id="selectArticulo" class="item-list" onchange="cambiarArticulo(this.value)">
        <option value="">-- Seleccionar --</option>
      </select>

      <!-- Columna S destacada -->
      <div id="articuloNombre" class="item-name-banner">Selecciona un artículo</div>
    </div>

    <!-- Tabla con las Columnas solicitadas -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width: 70px;" id="thB">B</th>
            <th id="thC">C</th>
            <th style="width: 110px;" id="thD">D</th>
            <th style="width: 90px;" id="thE">E</th>
            <th style="width: 90px;" id="thF">F</th>
            <th style="width: 90px;" id="thG">G</th>
            <th style="width: 90px;" id="thJ">J</th>
            <th style="width: 90px;" id="thQ">Q</th>
            <th style="width: 90px;" id="thR">R</th>
            <th id="thT">T</th>
          </tr>
        </thead>
        <tbody id="tablaBody">
          <tr>
            <td colspan="10" style="text-align: center; padding: 40px; color: #64748b;">Cargando datos desde Google Sheets...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL DE TU IMPLEMENTACIÓN DE GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbxvrtncixGOfADCqilBfoe5-uDv0lmabAATmVJbvTeiHlkOQTl6RmewBFjxvZta7K-EaA/exec";

    let agrupadoPorArticulo = {};
    let nombresArticulos = {};
    let encabezados = {};

    async function cargarDatos() {
      const cuerpo = document.getElementById("tablaBody");
      cuerpo.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px; color: #64748b;">Sincronizando información...</td></tr>';

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        encabezados = data.headers || {};
        actualizarNombresEncabezados();

        agrupadoPorArticulo = {};
        nombresArticulos = {};

        data.data.forEach(row => {
          const itemCode = String(row.colA).trim();
          if (!itemCode || itemCode.toUpperCase() === "ITEMCODE") return;

          if (!agrupadoPorArticulo[itemCode]) {
            agrupadoPorArticulo[itemCode] = [];
            nombresArticulos[itemCode] = row.colS || "Sin descripción asignada";
          }
          agrupadoPorArticulo[itemCode].push(row);
        });

        poblarListas();
      } catch (err) {
        cuerpo.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px; color: red;">Error al conectar con la hoja. Verifica tu conexión y permisos.</td></tr>';
      }
    }

    function actualizarNombresEncabezados() {
      if (encabezados.hB) document.getElementById("thB").textContent = encabezados.hB;
      if (encabezados.hC) document.getElementById("thC").textContent = encabezados.hC;
      if (encabezados.hD) document.getElementById("thD").textContent = encabezados.hD;
      if (encabezados.hE) document.getElementById("thE").textContent = encabezados.hE;
      if (encabezados.hF) document.getElementById("thF").textContent = encabezados.hF;
      if (encabezados.hG) document.getElementById("thG").textContent = encabezados.hG;
      if (encabezados.hJ) document.getElementById("thJ").textContent = encabezados.hJ;
      if (encabezados.hQ) document.getElementById("thQ").textContent = encabezados.hQ;
      if (encabezados.hR) document.getElementById("thR").textContent = encabezados.hR;
      if (encabezados.hT) document.getElementById("thT").textContent = encabezados.hT;
    }

    function poblarListas() {
      const datalist = document.getElementById("listaCodigos");
      const selector = document.getElementById("selectArticulo");

      datalist.innerHTML = "";
      selector.innerHTML = '<option value="">-- Seleccionar --</option>';

      const articulos = Object.keys(agrupadoPorArticulo).sort();

      articulos.forEach(art => {
        const opt = document.createElement("option");
        opt.value = art;
        datalist.appendChild(opt);

        const selOpt = document.createElement("option");
        selOpt.value = art;
        selOpt.textContent = art;
        selector.appendChild(selOpt);
      });

      if (articulos.length > 0) {
        cambiarArticulo(articulos[0]);
      }
    }

    function cambiarArticulo(codigo) {
      codigo = codigo.trim().toUpperCase();
      const cuerpo = document.getElementById("tablaBody");
      const nombreBanner = document.getElementById("articuloNombre");
      const input = document.getElementById("inputArticulo");
      const select = document.getElementById("selectArticulo");

      input.value = codigo;
      select.value = codigo;

      if (!agrupadoPorArticulo[codigo]) {
        nombreBanner.textContent = "Artículo no encontrado";
        cuerpo.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 30px; color: #64748b;">No existen registros para este artículo.</td></tr>';
        return;
      }

      nombreBanner.textContent = nombresArticulos[codigo] || "Artículo sin nombre";
      const rutas = agrupadoPorArticulo[codigo];
      cuerpo.innerHTML = "";

      rutas.forEach((r, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="center" style="font-weight: 700;">${r.colB || String(index + 1).padStart(2, "0")}</td>
          <td>${r.colC}</td>
          <td class="center"><span class="badge-ct">${r.colD}</span></td>
          <td class="num">${formatearNumero(r.colE)}</td>
          <td class="num">${formatearNumero(r.colF)}</td>
          <td class="num">${formatearNumero(r.colG)}</td>
          <td class="center">${r.colJ}</td>
          <td class="num">${formatearNumero(r.colQ)}</td>
          <td class="num">${formatearNumero(r.colR)}</td>
          <td>${r.colT}</td>
        `;
        cuerpo.appendChild(tr);
      });
    }

    function formatearNumero(valor) {
      if (valor === "" || valor === null || valor === undefined) return "0.00";
      const num = Number(valor);
      return !isNaN(num) ? num.toFixed(2) : valor;
    }

    cargarDatos();
  </script>
</body>
</html>
