<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutas de Operación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
    }

    body { 
      background: #f1f5f9; 
      padding: 24px; 
      color: #0f172a; 
      -webkit-font-smoothing: antialiased;
    }

    .window {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.04);
      max-width: 1440px;
      margin: 0 auto;
      overflow: hidden;
    }

    .window-title {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 1.05rem;
      color: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-sync {
      padding: 8px 16px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .btn-sync:hover { 
      background: #0369a1; 
    }

    .btn-sync:active {
      transform: scale(0.98);
    }

    .top-panel {
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .selector-label {
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
    }

    .input-code {
      padding: 8px 12px;
      font-size: 0.95rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      width: 170px;
      text-transform: uppercase;
      text-align: center;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-code:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    select.item-list {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      color: #1e293b;
      background: #ffffff;
      cursor: pointer;
      max-width: 240px;
      outline: none;
      transition: border-color 0.15s;
    }

    select.item-list:focus {
      border-color: #0284c7;
    }

    .item-name-banner {
      flex-grow: 1;
      min-width: 280px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #0284c7;
      padding: 10px 16px;
      font-size: 1.02rem;
      font-weight: 700;
      color: #0f172a;
      border-radius: 6px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      max-height: 650px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      white-space: nowrap;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 14px;
      border-bottom: 2px solid #e2e8f0;
      border-right: 1px solid #f1f5f9;
      text-align: center;
      z-index: 10;
    }

    tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid #f1f5f9;
      border-right: 1px solid #f1f5f9;
      color: #334155;
      text-align: center;
      vertical-align: middle;
    }

    tbody tr:nth-child(even) { 
      background-color: #fafbfd; 
    }

    tbody tr:hover { 
      background-color: #f0f7ff; 
    }

    .merged-cell {
      background-color: #ffffff !important;
      font-weight: 500;
      padding: 16px;
      white-space: normal;
      max-width: 320px;
      text-align: center;
      vertical-align: middle;
      border-left: 1px solid #f1f5f9;
    }

    .badge-status {
      display: inline-block;
      padding: 5px 12px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <div class="window">
    <div class="window-title">
      <span>Rutas de Operación</span>
      <button class="btn-sync" onclick="cargarDatos()">🔄 Recargar Hoja</button>
    </div>

    <div class="top-panel">
      <span class="selector-label">Artículo:</span>
      <input type="text" id="inputArticulo" class="input-code" placeholder="Código..." list="listaCodigos" oninput="cambiarArticulo(this.value)">
      <datalist id="listaCodigos"></datalist>

      <span class="selector-label">Seleccionar:</span>
      <select id="selectArticulo" class="item-list" onchange="cambiarArticulo(this.value)">
        <option value="">-- Seleccionar --</option>
      </select>

      <div id="articuloNombre" class="item-name-banner">Selecciona un artículo</div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width: 80px;" id="thB">Secuencia</th>
            <th id="thE">E</th>
            <th id="thF">F</th>
            <th id="thG">G</th>
            <th id="thJ">J</th>
            <th id="thQ">Notas</th>
            <th id="thR">Status</th>
            <th id="thT">T</th>
          </tr>
        </thead>
        <tbody id="tablaBody">
          <tr>
            <td colspan="8" style="padding: 48px; color: #64748b;">Cargando datos desde Google Sheets...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyiWKQByuhWXPNcYCix1gP-l0Cs2roXj7pehvqRVq1ZfG_7mRBf_qYemJ4jDO1Wti7ZwA/exec";

    let agrupadoPorArticulo = {};
    let nombresArticulos = {};
    let encabezados = {};

    async function cargarDatos() {
      const cuerpo = document.getElementById("tablaBody");
      cuerpo.innerHTML = '<tr><td colspan="8" style="padding: 48px; color: #64748b;">Sincronizando información...</td></tr>';

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        encabezados = data.headers || {};
        actualizarNombresEncabezados();

        agrupadoPorArticulo = {};
        nombresArticulos = {};

        data.data.forEach(row => {
          const itemCode = String(row.colA).trim();
          if (!itemCode || itemCode.toUpperCase() === "ITEMCODE") return;

          if (!agrupadoPorArticulo[itemCode]) {
            agrupadoPorArticulo[itemCode] = [];
            nombresArticulos[itemCode] = row.colS || "Sin descripción asignada";
          }
          agrupadoPorArticulo[itemCode].push(row);
        });

        poblarListas();
      } catch (err) {
        cuerpo.innerHTML = '<tr><td colspan="8" style="padding: 48px; color: #ef4444;">Error al conectar con la hoja. Verifica tu conexión y permisos.</td></tr>';
      }
    }

    function actualizarNombresEncabezados() {
      if (encabezados.hB) document.getElementById("thB").textContent = encabezados.hB;
      if (encabezados.hE) document.getElementById("thE").textContent = encabezados.hE;
      if (encabezados.hF) document.getElementById("thF").textContent = encabezados.hF;
      if (encabezados.hG) document.getElementById("thG").textContent = encabezados.hG;
      if (encabezados.hJ) document.getElementById("thJ").textContent = encabezados.hJ;
      if (encabezados.hQ) document.getElementById("thQ").textContent = encabezados.hQ;
      if (encabezados.hR) document.getElementById("thR").textContent = encabezados.hR;
      if (encabezados.hT) document.getElementById("thT").textContent = encabezados.hT;
    }

    function poblarListas() {
      const datalist = document.getElementById("listaCodigos");
      const selector = document.getElementById("selectArticulo");

      datalist.innerHTML = "";
      selector.innerHTML = '<option value="">-- Seleccionar --</option>';

      const articulos = Object.keys(agrupadoPorArticulo).sort();

      articulos.forEach(art => {
        const opt = document.createElement("option");
        opt.value = art;
        datalist.appendChild(opt);

        const selOpt = document.createElement("option");
        selOpt.value = art;
        selOpt.textContent = art;
        selector.appendChild(selOpt);
      });

      if (articulos.length > 0) {
        cambiarArticulo(articulos[0]);
      }
    }

    function cambiarArticulo(codigo) {
      codigo = codigo.trim().toUpperCase();
      const cuerpo = document.getElementById("tablaBody");
      const nombreBanner = document.getElementById("articuloNombre");
      const input = document.getElementById("inputArticulo");
      const select = document.getElementById("selectArticulo");

      input.value = codigo;
      select.value = codigo;

      if (!agrupadoPorArticulo[codigo]) {
        nombreBanner.textContent = "Artículo no encontrado";
        cuerpo.innerHTML = '<tr><td colspan="8" style="padding: 36px; color: #64748b;">No existen registros para este artículo.</td></tr>';
        return;
      }

      nombreBanner.textContent = nombresArticulos[codigo] || "Artículo sin nombre";
      const rutas = agrupadoPorArticulo[codigo];
      const totalFilas = rutas.length;
      cuerpo.innerHTML = "";

      const valorR = rutas.find(r => r.colR && r.colR !== "0" && r.colR !== "0.00")?.colR || "-";
      const valorT = rutas.find(r => r.colT && r.colT !== "0" && r.colT !== "0.00")?.colT || "-";

      rutas.forEach((r, index) => {
        const tr = document.createElement("tr");

        let celdasHTML = `
          <td style="font-weight: 700; font-family: 'JetBrains Mono', monospace;">${r.colB || String(index + 1).padStart(2, "0")}</td>
          <td>${limpiarValor(r.colE)}</td>
          <td>${limpiarValor(r.colF)}</td>
          <td>${limpiarValor(r.colG)}</td>
          <td>${limpiarValor(r.colJ)}</td>
          <td>${limpiarValor(r.colQ)}</td>
        `;

        if (index === 0) {
          celdasHTML += `
            <td rowspan="${totalFilas}" class="merged-cell"><span class="badge-status">${valorR}</span></td>
            <td rowspan="${totalFilas}" class="merged-cell">${valorT}</td>
          `;
        }

        tr.innerHTML = celdasHTML;
        cuerpo.appendChild(tr);
      });
    }

    function limpiarValor(valor) {
      if (valor === "" || valor === null || valor === undefined || valor === "0.00") return "-";
      return valor;
    }

    cargarDatos();
  </script>
</body>
</html>
